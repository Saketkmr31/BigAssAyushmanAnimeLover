name: Expand packaged application source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source.part-01 source.part-02 source.part-03 source.part-04 source.part-05 source.part-06 | base64 -d > /tmp/anime-source.tar.gz
          tar -tzf /tmp/anime-source.tar.gz >/dev/null
          tar -xzf /tmp/anime-source.tar.gz -C .
          rm source.part-01 source.part-02 source.part-03 source.part-04 source.part-05 source.part-06
      - name: Commit normal source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Expand application source into normal files"
            git push
          fi
